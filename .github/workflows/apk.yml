name: apk

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Ensure android project exists
        run: |
          if [ ! -d android ]; then
            flutter create --org app.family --project-name family_utility_app --platforms android .
          fi
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: family-utility-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
