name: apk

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Bootstrap platform projects once and commit them
        run: |
          set -e
          changed=0
          if [ ! -d android ]; then
            flutter create --org app.family --project-name family_utility_app --platforms android .
            changed=1
          fi
          if [ ! -d ios ]; then
            flutter create --org app.family --project-name family_utility_app --platforms ios .
            changed=1
          fi
          python3 tools/patch_android.py
          if [ "$changed" = "1" ] || ! git diff --quiet -- android ios; then
            git config user.name "family-utility-app ci"
            git config user.email "ci@users.noreply.github.com"
            git add android ios
            git commit -m "chore(android): platform projects generated and patched by CI" || true
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: family-utility-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
