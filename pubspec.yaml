name: family_utility_app
description: A private, offline-first utility app for one family.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # 110 Indian languages per profile: Flutter's own widget strings in each.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 051 QR scanner: on-device decode and the actions a result can take.
  mobile_scanner: ^7.0.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  flutter_contacts: ^1.1.9
  add_2_calendar: ^3.0.1
  wifi_iot: ^0.3.18
  # 059 On-device mode: remembers the switch.
  shared_preferences: ^2.3.0
  # 055 App lock: PIN hash in secure storage, biometrics on device.
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  # 057 Secure notes: AES-256-GCM, pure Dart.
  cryptography: ^2.7.0
  # 062 Phone to laptop: QR for the link, picking files to offer.
  qr_flutter: ^4.1.0
  # 052 QR generator: the QR matrix for PNG, SVG and print sheets.
  qr: ^3.0.1
  file_picker: ^10.3.7
  # 001 PDF viewer: PDFium on device, with text selection.
  pdfrx: ^2.0.0
  # 034 Compress images: pure-Dart decode and encode.
  image: ^4.2.0
  # 029 Archives: AES block cipher, PBKDF2 and HMAC for WinZip AES ZIPs.
  pointycastle: ^3.9.1
  # 021 Images to PDF: take a photo with the camera.
  image_picker: ^1.1.2
  # 047 Document scanner: live preview frames for edge detection.
  camera: ^0.11.0
  # 018 Word to PDF and back: reads and writes the XML inside DOCX.
  xml: ^6.5.0
  # 043 Passport photo maker: on-device face detection.
  google_mlkit_face_detection: ^0.13.1
  # 008 OCR a scan: on-device text recognition, Latin and Devanagari.
  google_mlkit_text_recognition: ^0.15.0
  # 026 WebP: the phone's own codec writes WebP.
  flutter_image_compress: ^2.3.0
  # 066 Copy result: images go on the clipboard as images.
  pasteboard: ^0.3.0
  # 067 Background jobs: foreground service and progress notification.
  flutter_local_notifications: ^17.2.4
  # 088 Medicine reminders: alarms at an exact instant.
  timezone: ^0.9.4
  # 076 Live family location: one fix at a time, at the engine's pace.
  geolocator: ^13.0.2
  # 036 Compress video: the phone's hardware encoder.
  video_compress: ^3.1.3
  # 130 Universal video player: libmpv plays MKV, AVI, MOV, WebM, TS with
  # embedded and SRT subtitles (the plan's ffmpeg_kit_flutter is retired).
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-SpaceGrotesk.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
